services:
  # PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: simplestore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplestore_db
      POSTGRES_USER: simplestore_user
      POSTGRES_PASSWORD: simplestore_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplestore_user -d simplestore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: simplestore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API (with hot reloading)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: simplestore_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: simplestore_db
      POSTGRES_USER: simplestore_user
      POSTGRES_PASSWORD: simplestore_password
      DATABASE_URL: postgresql+asyncpg://simplestore_user:simplestore_password@db:5432/simplestore_db
      DATABASE_SYNC_URL: postgresql://simplestore_user:simplestore_password@db:5432/simplestore_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      NEON_DB_URL: ${NEON_DB_URL:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: simplestore_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
